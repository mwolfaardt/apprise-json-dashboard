<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Notification Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #121212;
            color: #e0e0e0;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            color: #bb86fc;
        }
        .card {
            background: #1e1e1e;
            border-left: 4px solid #bb86fc;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: fadeIn 0.4s ease-in-out;
        }
        .card-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #bb86fc;
            margin-bottom: 5px;
        }
        .card-body {
            color: #ffffff;
            font-size: 1em;
            word-break: break-word;
        }
        .card-time {
            font-size: 0.8em;
            color: #888;
            margin-top: 10px;
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #status {
            font-size: 0.9em;
            color: #03dac6;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <h1>Live Notification Dashboard</h1>
    <div id="status">Connecting to live feed...</div>
    <div id="feed"></div>

    <script>
        const statusDiv = document.getElementById("status");
        const feed = document.getElementById("feed");

        let evtSource;

        function connect() {
            if (evtSource) {
                evtSource.close();
            }

            evtSource = new EventSource("/stream");

            evtSource.onopen = function() {
                statusDiv.textContent = "● Connected (Listening for messages)";
                statusDiv.style.color = "#03dac6";
            };

            evtSource.onerror = function() {
                statusDiv.textContent = "○ Disconnected (Reconnecting...)";
                statusDiv.style.color = "#cf6679";
                // Close the errored connection so the browser creates a fresh one
                if (evtSource) {
                    evtSource.close();
                }
                setTimeout(connect, 3000); // Try reconnecting every 3 seconds
            };

            evtSource.onmessage = function(event) {
                // Ignore empty heartbeat comments
                if (!event.data) return;

                const data = JSON.parse(event.data);

                const div = document.createElement("div");
                div.className = "card";

                const title = data.title || "Notification";
                const body = data.body || data.message || JSON.stringify(data, null, 2);

                div.innerHTML = `
                    <div class="card-title">${escapeHtml(title)}</div>
                    <div class="card-body">${escapeHtml(body)}</div>
                    <span class="card-time">${new Date().toLocaleTimeString()}</span>
                `;

                feed.prepend(div);
            };
        }

        function escapeHtml(text) {
            if (typeof text !== 'string') text = String(text);
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Start initial connection
        connect();
    </script>
</body>
</html>
